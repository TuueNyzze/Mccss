apiVersion: apps/v1
kind: Deployment
metadata:
  name: mccss-substrate
  labels:
    app: mccss-substrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mccss-substrate
  template:
    metadata:
      labels:
        app: mccss-substrate
    spec:
      containers:
        - name: substrate
          image: mccss-substrate:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
