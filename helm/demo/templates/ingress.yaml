{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mccss-demo.fullname" . }}-ingress
spec:
  rules:
    - host: {{ .Values.ingress.host | default "mccss.local" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mccss-demo.fullname" . }}-edenfield
                port:
                  number: {{ .Values.service.edenfieldPort }}
{{- end }}
