name: Build and push demo images

on:
  push:
    branches: [ main, 'demo/*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push substrate image
        uses: docker/build-push-action@v4
        with:
          context: ./MCCSS--main
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/mccss-substrate:demo
            ghcr.io/${{ github.repository_owner }}/mccss-substrate:${{ github.sha }}

      - name: Build and push edenfield-admin image
        uses: docker/build-push-action@v4
        with:
          context: ./MCCSS--main/Edenfield-main
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/edenfield-admin:demo
            ghcr.io/${{ github.repository_owner }}/edenfield-admin:${{ github.sha }}
