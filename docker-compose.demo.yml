version: '3.8'
services:
  substrate:
    build:
      context: ./MCCSS--main
      dockerfile: Dockerfile
    image: mccss-substrate:demo
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_PORT=9321
    ports:
      - "3000:3000"
    volumes:
      - ./MCCSS--main:/app:cached

  edenfield-admin:
    build:
      context: ./MCCSS--main/Edenfield-main
      dockerfile: Dockerfile
    image: edenfield-admin:demo
    environment:
      - NODE_ENV=production
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - ADMIN_PORT=9321
    ports:
      - "8000:8000"
      - "9321:9321"
    volumes:
      - ./MCCSS--main/Edenfield-main:/app/Edenfield-main:cached

networks:
  default:
    name: mccss-demo-net
